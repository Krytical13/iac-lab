name: validate

on:
  push:
  pull_request:

jobs:
  terraform:
    name: terraform fmt + validate + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # -backend=false: fetch providers and modules without touching any state backend.
      # validate needs the providers' schemas, so init must run first.
      - name: terraform init
        working-directory: terraform/environments/hyperv
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: terraform/environments/hyperv
        run: terraform validate

      # Unit tests: every provider is mocked in tests/*.tftest.hcl, so this job
      # needs no Hyper-V host and no secrets, and it creates nothing.
      - name: terraform test
        working-directory: terraform/environments/hyperv
        run: terraform test

      # The Azure environment gets the same three steps. Its provider is mocked
      # too, so no Azure account, no sign-in and no secrets are involved.
      - name: terraform init (azure)
        working-directory: terraform/environments/azure
        run: terraform init -backend=false -input=false

      - name: terraform validate (azure)
        working-directory: terraform/environments/azure
        run: terraform validate

      - name: terraform test (azure)
        working-directory: terraform/environments/azure
        run: terraform test

      # The network layer is a second root module in the same subscription.
      - name: terraform init (azure-network)
        working-directory: terraform/environments/azure-network
        run: terraform init -backend=false -input=false

      - name: terraform validate (azure-network)
        working-directory: terraform/environments/azure-network
        run: terraform validate

      - name: terraform test (azure-network)
        working-directory: terraform/environments/azure-network
        run: terraform test

      # The azure-plan workflow plans this layer with import blocks and no
      # state. This checks that the blocks still match the resources of the
      # layer. It needs no account and no sign-in.
      - name: import blocks for the pipeline (azure-network)
        run: tests/tf-imports.sh

      # The identity layer is a third root module in the same subscription.
      - name: terraform init (azure-identity)
        working-directory: terraform/environments/azure-identity
        run: terraform init -backend=false -input=false

      - name: terraform validate (azure-identity)
        working-directory: terraform/environments/azure-identity
        run: terraform validate

      - name: terraform test (azure-identity)
        working-directory: terraform/environments/azure-identity
        run: terraform test

  ansible:
    name: ansible lint + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install ansible-core and ansible-lint
        run: pip install ansible-core ansible-lint

      # The same gate as on a control node: installs the collections and the
      # Galaxy role from requirements.yml, checks the inventory directory parses
      # cleanly, syntax-checks site.yml and runs ansible-lint.
      - name: tests/ansible-static.sh
        run: tests/ansible-static.sh

  vault:
    name: vault dev-server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: install the vault CLI from HashiCorp's apt repository
        run: |
          wget -qO- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update -qq && sudo apt-get install -y -qq vault jq
          vault version

      # Loads the policies and SSH roles, builds the PKI and runs Vault Agent
      # once with the committed config, against a throwaway dev server.
      - name: tests/vault-static.sh
        run: tests/vault-static.sh
