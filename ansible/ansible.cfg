# ansible/ansible.cfg — project-level configuration. Ansible reads the
# ansible.cfg in the current directory, so run every command from ansible/.
# Precedence: ANSIBLE_CONFIG env var > ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg

[defaults]
# The lab inventory is a DIRECTORY: Terraform writes hosts.yml into it, you own
# groups.yml, and group_vars/ lives beside them. Ansible reads every file in an
# inventory directory as an inventory source, so files that are not inventories
# must be listed here; the default list plus .example (hosts.yml.example).
inventory = inventories/hyperv-lab
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .swp, .rpm, .md, .txt, .rst, .example

# Our roles live in roles/; ansible-galaxy installs third-party roles into the
# FIRST entry, galaxy_roles/ (gitignored), so they never mix with ours.
roles_path = galaxy_roles:roles

# Decrypts !vault values at runtime. The file is gitignored; create it in
# Module 00 (the lab password is "labpassword").
vault_password_file = .vault_pass

# Lab VMs are rebuilt often and come back with new host keys; in production,
# keep host key checking on and manage known_hosts.
host_key_checking = False
retry_files_enabled = False

# Pick python3 on the target without the "discovered interpreter" warning.
interpreter_python = auto_silent

# Per-task timings at the end of every run (plugin from the ansible.posix collection).
callbacks_enabled = ansible.posix.profile_tasks

[privilege_escalation]
# Escalation is declared where it is needed (play- or task-level become: true),
# not switched on globally, so a playbook reads the same everywhere.
become = false
