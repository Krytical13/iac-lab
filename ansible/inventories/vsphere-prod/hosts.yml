    web_servers:
      hosts:
        web-01:
          ansible_host: 10.0.1.11
        web-02:
          ansible_host: 10.0.1.12
    db_servers:
      hosts:
        db-01:
          ansible_host: 10.0.1.21
    monitoring:
      hosts:
        mon-01:
          ansible_host: 10.0.1.31
    linux:
      children:
        web_servers:
        db_servers:
        monitoring:
      vars:
        ansible_user: sysadmin
        ansible_python_interpreter: /usr/bin/python3