---
# roles/base/defaults/main.yml — the knobs. Override in group_vars or host_vars.
# Per-family names (sudo group, service names, paths) are not here: see vars/.

# Packages wanted on every server; vars/<os_family>.yml adds the family-specific ones.
base_packages:
  - vim
  - curl
  - htop
  - wget
  - unzip
  - git
  - net-tools
  - jq
  - ca-certificates

# Users
admin_user: sysadmin
admin_ssh_keys: []        # the lab sets this in group_vars/linux/main.yml

# SSH certificates (Vault guide, Module 04). Both are off until you fill them in:
# the public key(s) of a Vault SSH CA whose user certificates sshd should accept,
# and the host certificate file sshd should present. The lab writes them into the
# gitignored group_vars/linux/ssh_ca.yml once its Vault has a CA.
ssh_trusted_user_ca_keys: []
ssh_host_certificate: ""

# Firewall — rules for ALL servers. A rule without src is open to anyone.
# The lab's group_vars set both networks from the lab_network Terraform wrote.
base_firewall_rules:
  - { port: "22", proto: tcp, comment: "SSH" }
  - { port: "161", proto: udp, src: "{{ snmpd_allowed_network | default('any') }}", comment: "SNMP" }
  - { port: "9100", proto: tcp, src: "{{ monitoring_network | default('any') }}", comment: "node_exporter" }

# Extra rules for a group or a host. Ansible REPLACES a list variable, it does
# not merge it, so host_vars that need the group's ports must repeat them.
extra_firewall_rules: []

# Sysctl kernel hardening
sysctl_settings:
  net.ipv4.ip_forward: "0"
  net.ipv4.tcp_syncookies: "1"
  net.ipv4.conf.all.accept_redirects: "0"
  net.ipv4.conf.default.accept_redirects: "0"
  net.ipv4.conf.all.send_redirects: "0"
  net.ipv4.conf.all.accept_source_route: "0"
  net.ipv4.conf.all.log_martians: "1"
  net.ipv6.conf.all.accept_redirects: "0"
  net.ipv6.conf.default.accept_redirects: "0"
  kernel.randomize_va_space: "2"
  kernel.kptr_restrict: "2"
  kernel.dmesg_restrict: "1"

# Per-group or per-host exceptions, merged over sysctl_settings. A Docker host
# needs net.ipv4.ip_forward=1 (dockerd turns it on at start; this baseline would
# turn it off again on the next run and break every container's networking).
base_sysctl_overrides: {}

# Chrony NTP
chrony_ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org
