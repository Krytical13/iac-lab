---
# roles/base/tasks/firewall.yml
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true

- name: Set default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny
  become: true

- name: Set default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow
  become: true

- name: Allow base firewall rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src | default('any') }}"
    comment: "{{ item.comment }}"
  loop: "{{ base_firewall_rules }}"
  become: true

- name: Allow extra firewall rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src | default('any') }}"
    comment: "{{ item.comment }}"
  loop: "{{ extra_firewall_rules }}"
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true