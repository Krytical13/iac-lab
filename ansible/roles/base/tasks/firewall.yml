---
# roles/base/tasks/firewall.yml
# One rule list, two backends. base_firewall_rules (defaults) + extra_firewall_rules
# (group_vars / host_vars) are applied by the task file for this family's backend:
# firewall-ufw.yml on Debian, firewall-firewalld.yml on RedHat.
- name: Apply firewall rules with {{ base_firewall_backend }}
  ansible.builtin.include_tasks: "firewall-{{ base_firewall_backend }}.yml"
