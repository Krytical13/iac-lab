---
# roles/base/tasks/chrony.yml
- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
  become: true

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony
  become: true

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  become: true