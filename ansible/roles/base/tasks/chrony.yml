---
# roles/base/tasks/chrony.yml
- name: Install chrony
  ansible.builtin.package:
    name: chrony
    state: present
  become: true

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ base_chrony_conf }}"           # /etc/chrony/chrony.conf on Debian, /etc/chrony.conf on RedHat
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony
  become: true

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: "{{ base_chrony_service }}"        # chrony on Debian, chronyd on RedHat
    enabled: true
    state: started
  become: true
  # Under --check the package above is not really installed, so the unit does
  # not exist yet; report that as "ignored" instead of failing the dry run.
  ignore_errors: "{{ ansible_check_mode }}"
