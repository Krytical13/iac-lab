---
# roles/base/tasks/chrony.yml
- name: Install chrony
  ansible.builtin.package:
    name: chrony
    state: present
  become: true

- name: Deploy chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ base_chrony_conf }}"           # /etc/chrony/chrony.conf on Debian, /etc/chrony.conf on RedHat
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony
  become: true

- name: Enable and start chrony
  ansible.builtin.systemd:
    name: "{{ base_chrony_service }}"        # chrony on Debian, chronyd on RedHat
    enabled: true
    state: started
  become: true
