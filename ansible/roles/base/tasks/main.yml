---
# roles/base/tasks/main.yml — the Linux baseline, Debian and RedHat families.
# The first task loads the per-family names (package, service, path, sudo group,
# firewall backend) from vars/<os_family>.yml; every task file below uses those
# variables instead of hardcoding Ubuntu. Each import carries a tag so a subset
# can be run alone: --tags firewall, --tags ssh, ...
- name: Load OS family variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"
  tags: [always]

- name: Include package tasks
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: Include user tasks
  ansible.builtin.import_tasks: users.yml
  tags: [users]

- name: Include SSH hardening tasks
  ansible.builtin.import_tasks: ssh.yml
  tags: [ssh]

- name: Include chrony time sync tasks
  ansible.builtin.import_tasks: chrony.yml
  tags: [chrony]

- name: Include sysctl kernel hardening tasks
  ansible.builtin.import_tasks: sysctl.yml
  tags: [sysctl]

- name: Include firewall tasks
  ansible.builtin.import_tasks: firewall.yml
  tags: [firewall]
