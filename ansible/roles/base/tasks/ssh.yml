---
# roles/base/tasks/ssh.yml
# The CA file is written BEFORE the config that references it, so sshd's
# validation below never sees a TrustedUserCAKeys line pointing at nothing.
- name: Deploy the SSH user CA public keys
  ansible.builtin.copy:
    # a single key may be given as a plain string instead of a one-item list
    content: "{{ ([ssh_trusted_user_ca_keys] if ssh_trusted_user_ca_keys is string else ssh_trusted_user_ca_keys) | join('\n') }}\n"
    dest: /etc/ssh/trusted-user-ca-keys.pem
    owner: root
    group: root
    mode: "0644"
  when: ssh_trusted_user_ca_keys | length > 0
  notify: Reload sshd
  become: true

# validate: sshd checks the rendered file BEFORE it replaces the live one, so a
# typo in the template fails this task instead of leaving sshd unable to start.
- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
  notify: Reload sshd
  become: true
