---
# roles/base/tasks/ssh.yml
# validate: sshd checks the rendered file BEFORE it replaces the live one, so a
# typo in the template fails this task instead of leaving sshd unable to start.
- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
  notify: Reload sshd
  become: true
