---
# roles/base/tasks/firewall-ufw.yml — Debian family. Default deny in, allow out,
# then every rule in the list. ufw is enabled LAST, after the SSH rule exists.
- name: Install UFW
  ansible.builtin.package:
    name: ufw
    state: present
  become: true

- name: Set default deny incoming
  community.general.ufw:
    direction: incoming
    default: deny
  become: true

- name: Set default allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow
  become: true

- name: Allow firewall rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ item.src | default('any') }}"
    comment: "{{ item.comment }}"
  loop: "{{ base_firewall_rules + extra_firewall_rules }}"
  become: true

# ufw applies /etc/ufw/sysctl.conf every time it starts, and that file turns
# log_martians OFF — undoing the sysctl hardening on the next boot and making
# the second run report a change. Align it with sysctl_settings first.
- name: Align ufw's own sysctl file with the kernel hardening
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: '^#?net/ipv4/conf/{{ item }}/log_martians='
    line: "net/ipv4/conf/{{ item }}/log_martians=1"
  loop: [all, default]
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true
