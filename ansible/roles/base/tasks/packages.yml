---
# roles/base/tasks/packages.yml
# ansible.builtin.package picks apt or dnf from the target's facts; the per-family
# package names come from vars/<os_family>.yml.
- name: Enable EPEL (RedHat family; htop lives there)
  ansible.builtin.package:
    name: epel-release
    state: present
  become: true
  when: ansible_os_family == "RedHat"

- name: Install baseline packages
  ansible.builtin.package:
    name: "{{ base_packages + base_packages_os }}"
    state: present
  become: true

- name: Remove unwanted packages
  ansible.builtin.package:
    name: "{{ base_packages_remove }}"
    state: absent
  become: true

- name: Install automatic update tooling
  ansible.builtin.package:
    name: "{{ base_auto_update_packages }}"
    state: present
  become: true

- name: Configure unattended upgrades (Debian family)
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  become: true
  when: ansible_os_family == "Debian"

- name: Configure dnf-automatic to apply updates (RedHat family)
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^apply_updates\s*='
    line: apply_updates = yes
  become: true
  when: ansible_os_family == "RedHat"

- name: Enable the dnf-automatic timer (RedHat family)
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
  become: true
  when: ansible_os_family == "RedHat"
  ignore_errors: "{{ ansible_check_mode }}"   # unit missing until the package is really installed
