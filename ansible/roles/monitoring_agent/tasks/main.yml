---
# roles/monitoring_agent/tasks/main.yml
- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Download and install node_exporter
  block:
    - name: Download node_exporter
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ go_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
        checksum: "sha256:{{ node_exporter_checksum }}"
      register: download

    - name: Extract node_exporter
      ansible.builtin.unarchive:
        src: "{{ download.dest }}"
        dest: /tmp
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ go_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

  always:
    - name: Clean up download
      ansible.builtin.shell:
        cmd: rm -rf /tmp/node_exporter-{{ node_exporter_version }}*
      changed_when: false
  become: true

- name: Deploy systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter
  become: true

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Allow node_exporter through firewall
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: "{{ monitoring_network | default('any') }}"
    comment: "node_exporter metrics"
  become: true