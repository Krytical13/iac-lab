---
# roles/monitoring_agent/tasks/main.yml — Prometheus node_exporter from the
# GitHub release, checksum-verified, installed only when the wanted version is
# not already there (so a second run changes nothing). The firewall is NOT
# opened here: the base role allows 9100/tcp from monitoring_network.
- name: Create node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Check the installed node_exporter version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false

- name: Download and install node_exporter {{ node_exporter_version }}
  when: >-
    node_exporter_installed.rc != 0
    or node_exporter_version not in (node_exporter_installed.stdout ~ node_exporter_installed.stderr)
  become: true
  block:
    - name: Download node_exporter
      ansible.builtin.get_url:
        url: "{{ node_exporter_url }}"
        dest: "/tmp/{{ node_exporter_archive }}.tar.gz"
        checksum: "sha256:{{ node_exporter_checksum }}"
        mode: "0644"

    - name: Extract node_exporter
      ansible.builtin.unarchive:
        src: "/tmp/{{ node_exporter_archive }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install node_exporter binary
      ansible.builtin.copy:
        src: "/tmp/{{ node_exporter_archive }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart node_exporter

  always:
    - name: Clean up the download
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/{{ node_exporter_archive }}.tar.gz"
        - "/tmp/{{ node_exporter_archive }}"

- name: Deploy systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter
  become: true

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
  become: true
