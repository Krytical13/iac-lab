---
# roles/snmpd/tasks/main.yml — SNMP agent for PRTG (or any poller).
# The firewall is NOT opened here: the base role's base_firewall_rules already
# allow 161/udp from snmpd_allowed_network, on ufw and firewalld alike.
- name: Load OS family variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"
  tags: [always]

- name: Install snmpd
  ansible.builtin.package:
    name: "{{ snmpd_packages }}"
    state: present
  become: true

- name: Deploy snmpd configuration
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: /etc/snmp/snmpd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart snmpd
  become: true

- name: Enable and start snmpd
  ansible.builtin.systemd:
    name: snmpd
    enabled: true
    state: started
  become: true
  ignore_errors: "{{ ansible_check_mode }}"   # unit missing until the package is really installed
