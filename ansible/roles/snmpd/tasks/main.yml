---
# roles/snmpd/tasks/main.yml
- name: Install snmpd
  ansible.builtin.apt:
    name: snmpd
    state: present
  become: true

- name: Deploy snmpd configuration
  ansible.builtin.template:
    src: snmpd.conf.j2
    dest: /etc/snmp/snmpd.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart snmpd
  become: true

- name: Allow SNMP through firewall
  community.general.ufw:
    rule: allow
    port: "161"
    proto: udp
    src: "{{ snmpd_allowed_network }}"
    comment: "SNMP from PRTG"
  become: true

- name: Enable and start snmpd
  ansible.builtin.systemd:
    name: snmpd
    enabled: true
    state: started
  become: true

# Handler
- name: Restart snmpd
  ansible.builtin.systemd:
    name: snmpd
    state: restarted
  become: true
  listen: "Restart snmpd"